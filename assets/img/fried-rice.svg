<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a wok of fried rice with egg, shrimp and scallions">
  <defs>
    <linearGradient id="p6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6EFE0"/><stop offset="1" stop-color="#E3D5B9"/>
    </linearGradient>
    <linearGradient id="wok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A322C"/><stop offset="1" stop-color="#1C1815"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p6)"/>
  <circle cx="670" cy="130" r="150" fill="#DFA13B" opacity=".18"/>

  <ellipse cx="400" cy="330" rx="260" ry="120" fill="url(#wok)"/>
  <ellipse cx="400" cy="322" rx="260" ry="118" fill="none" stroke="#55493F" stroke-width="7"/>
  <ellipse cx="400" cy="320" rx="216" ry="96" fill="#E8B454"/>

  <!-- rice grains -->
  <g fill="#F6E3B4">
    <g id="r"><ellipse cx="0" cy="0" rx="11" ry="6.5"/></g>
    <use href="#r" transform="translate(300 292) rotate(-18)"/>
    <use href="#r" transform="translate(348 276) rotate(12)"/>
    <use href="#r" transform="translate(396 296) rotate(-8)"/>
    <use href="#r" transform="translate(444 278) rotate(22)"/>
    <use href="#r" transform="translate(492 300) rotate(-14)"/>
    <use href="#r" transform="translate(276 330) rotate(8)"/>
    <use href="#r" transform="translate(330 344) rotate(-22)"/>
    <use href="#r" transform="translate(384 336) rotate(16)"/>
    <use href="#r" transform="translate(440 348) rotate(-6)"/>
    <use href="#r" transform="translate(498 336) rotate(20)"/>
    <use href="#r" transform="translate(356 372) rotate(-12)"/>
    <use href="#r" transform="translate(424 376) rotate(10)"/>
  </g>
  <!-- egg -->
  <g fill="#F2C24E">
    <ellipse cx="318" cy="308" rx="24" ry="13" transform="rotate(-16 318 308)"/>
    <ellipse cx="466" cy="326" rx="22" ry="12" transform="rotate(14 466 326)"/>
  </g>
  <!-- shrimp -->
  <g fill="#E9714E">
    <path d="M366 300c18-14 42-10 48 8s-10 32-28 28-30-22-20-36Z"/>
    <path d="M486 288c16-12 38-9 43 7s-9 29-25 25-27-20-18-32Z"/>
  </g>
  <!-- peas + scallion -->
  <g fill="#5E7F60">
    <circle cx="284" cy="304" r="8"/><circle cx="412" cy="264" r="7"/>
    <circle cx="520" cy="316" r="8"/><circle cx="352" cy="356" r="7"/>
    <circle cx="462" cy="366" r="6"/>
  </g>
</svg>
