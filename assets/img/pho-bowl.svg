<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a bowl of pho with steam, noodles, herbs and chopsticks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1613"/><stop offset="1" stop-color="#0C0B0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#DFA13B" stop-opacity=".34"/>
      <stop offset="1" stop-color="#DFA13B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="broth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98A34"/><stop offset="1" stop-color="#9A5F1C"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6EE"/><stop offset="1" stop-color="#DCCFB8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- steam -->
  <g fill="none" stroke="#F6F1E7" stroke-opacity=".28" stroke-width="7" stroke-linecap="round">
    <path d="M338 168c-22-26 18-42-4-70"/>
    <path d="M400 152c-24-30 20-48-4-80"/>
    <path d="M462 168c-22-26 18-42-4-70"/>
  </g>

  <!-- bowl -->
  <ellipse cx="400" cy="316" rx="212" ry="52" fill="#0C0B0A" opacity=".55"/>
  <path d="M188 312h424c0 108-95 176-212 176S188 420 188 312Z" fill="url(#bowl)"/>
  <path d="M188 312h424c0 18-3 35-8 51H196c-5-16-8-33-8-51Z" fill="#EFE5D2"/>
  <ellipse cx="400" cy="312" rx="212" ry="50" fill="url(#broth)"/>
  <ellipse cx="400" cy="312" rx="212" ry="50" fill="none" stroke="#FAF6EE" stroke-opacity=".5" stroke-width="5"/>

  <!-- noodles -->
  <g stroke="#F5EBD5" stroke-width="7" stroke-linecap="round" fill="none" opacity=".95">
    <path d="M300 306c26-16 60-16 86 0"/>
    <path d="M330 292c26-14 60-14 86 0"/>
    <path d="M420 300c22-14 52-14 74 0"/>
  </g>

  <!-- rare steak slices -->
  <g fill="#B4472F">
    <ellipse cx="330" cy="296" rx="48" ry="19" transform="rotate(-9 330 296)"/>
    <ellipse cx="452" cy="304" rx="44" ry="17" transform="rotate(7 452 304)"/>
  </g>
  <g fill="#8E3220" opacity=".55">
    <ellipse cx="330" cy="290" rx="34" ry="10" transform="rotate(-9 330 290)"/>
    <ellipse cx="452" cy="299" rx="30" ry="9" transform="rotate(7 452 299)"/>
  </g>

  <!-- herbs + scallion -->
  <g fill="#5E7F60">
    <ellipse cx="272" cy="304" rx="26" ry="14" transform="rotate(-20 272 304)"/>
    <ellipse cx="510" cy="298" rx="24" ry="13" transform="rotate(16 510 298)"/>
    <circle cx="392" cy="286" r="9"/><circle cx="416" cy="292" r="7"/><circle cx="368" cy="294" r="6"/>
  </g>
  <!-- chili + lime -->
  <circle cx="486" cy="316" r="11" fill="#C0402A"/>
  <circle cx="288" cy="322" r="14" fill="#9CB84E"/>
  <circle cx="288" cy="322" r="7" fill="#C7DA84"/>

  <!-- chopsticks -->
  <g stroke="#7A4A22" stroke-width="10" stroke-linecap="round">
    <path d="M520 214 640 128"/><path d="M540 236 660 150"/>
  </g>
</svg>
