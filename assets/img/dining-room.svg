<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Illustration of the Jenni Pho dining room with pendant lights and an open kitchen window">
  <defs>
    <linearGradient id="p9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#571318"/><stop offset="1" stop-color="#24080A"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#DFA13B" stop-opacity=".5"/><stop offset="1" stop-color="#DFA13B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#p9)"/>

  <!-- pendants -->
  <g stroke="#5A4C3E" stroke-width="3">
    <path d="M150 0v130"/><path d="M300 0v170"/><path d="M450 0v130"/>
  </g>
  <g fill="#DFA13B">
    <path d="M110 130h80l-14 46h-52Z"/><path d="M258 170h84l-15 48h-54Z"/><path d="M410 130h80l-14 46h-52Z"/>
  </g>
  <ellipse cx="150" cy="176" rx="120" ry="150" fill="url(#lamp)"/>
  <ellipse cx="300" cy="218" rx="130" ry="160" fill="url(#lamp)"/>
  <ellipse cx="450" cy="176" rx="120" ry="150" fill="url(#lamp)"/>

  <!-- open kitchen window -->
  <rect x="70" y="248" width="460" height="140" rx="10" fill="#3D0D11" stroke="#3E342B" stroke-width="4"/>
  <rect x="90" y="268" width="420" height="100" rx="6" fill="#6B1419"/>
  <g fill="#DFA13B" opacity=".55">
    <rect x="120" y="300" width="70" height="10" rx="5"/>
    <rect x="220" y="318" width="90" height="10" rx="5"/>
    <rect x="352" y="298" width="80" height="10" rx="5"/>
  </g>
  <g fill="#F6F1E7" opacity=".18">
    <circle cx="176" cy="336" r="16"/><circle cx="322" cy="292" r="14"/><circle cx="412" cy="336" r="15"/>
  </g>

  <!-- tables -->
  <g>
    <rect x="60" y="470" width="200" height="16" rx="8" fill="#EFE5D2"/>
    <rect x="86" y="486" width="14" height="120" fill="#3E342B"/><rect x="220" y="486" width="14" height="120" fill="#3E342B"/>
    <ellipse cx="120" cy="462" rx="30" ry="12" fill="#FAF6EE"/><ellipse cx="120" cy="458" rx="22" ry="8" fill="#C98A34"/>
    <ellipse cx="200" cy="462" rx="26" ry="10" fill="#FAF6EE"/>
  </g>
  <g>
    <rect x="340" y="470" width="200" height="16" rx="8" fill="#EFE5D2"/>
    <rect x="366" y="486" width="14" height="120" fill="#3E342B"/><rect x="500" y="486" width="14" height="120" fill="#3E342B"/>
    <ellipse cx="400" cy="462" rx="30" ry="12" fill="#FAF6EE"/><ellipse cx="400" cy="458" rx="22" ry="8" fill="#C98A34"/>
    <ellipse cx="480" cy="462" rx="26" ry="10" fill="#FAF6EE"/>
  </g>

  <!-- chairs -->
  <g fill="#3E342B">
    <rect x="40" y="520" width="52" height="14" rx="7"/><rect x="46" y="534" width="10" height="72"/><rect x="76" y="534" width="10" height="72"/>
    <rect x="248" y="520" width="52" height="14" rx="7"/><rect x="254" y="534" width="10" height="72"/><rect x="284" y="534" width="10" height="72"/>
    <rect x="320" y="520" width="52" height="14" rx="7"/><rect x="326" y="534" width="10" height="72"/><rect x="356" y="534" width="10" height="72"/>
    <rect x="516" y="520" width="52" height="14" rx="7"/><rect x="522" y="534" width="10" height="72"/><rect x="552" y="534" width="10" height="72"/>
  </g>

  <!-- floor -->
  <rect y="606" width="600" height="194" fill="#2A0A0C"/>
  <g stroke="#571318" stroke-width="3">
    <path d="M0 650h600"/><path d="M0 700h600"/><path d="M0 750h600"/>
  </g>
</svg>
