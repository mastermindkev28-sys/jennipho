<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of fresh spring rolls with peanut dipping sauce">
  <defs>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1E4"/><stop offset="1" stop-color="#E7DCC4"/>
    </linearGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/><stop offset="1" stop-color="#E9E0CD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p2)"/>
  <circle cx="150" cy="110" r="150" fill="#5E7F60" opacity=".1"/>
  <circle cx="690" cy="500" r="170" fill="#DFA13B" opacity=".14"/>

  <!-- plate -->
  <ellipse cx="400" cy="360" rx="300" ry="130" fill="#FFFDF8"/>
  <ellipse cx="400" cy="360" rx="300" ry="130" fill="none" stroke="#DCCFB8" stroke-width="4"/>
  <ellipse cx="400" cy="360" rx="240" ry="100" fill="none" stroke="#E7DCC4" stroke-width="3"/>

  <!-- rolls -->
  <g>
    <g transform="rotate(-16 300 330)">
      <rect x="182" y="292" width="236" height="82" rx="41" fill="url(#wrap)" stroke="#D8CBB2" stroke-width="3"/>
      <g opacity=".85">
        <ellipse cx="240" cy="333" rx="26" ry="15" fill="#E9714E"/>
        <ellipse cx="300" cy="333" rx="26" ry="15" fill="#E9714E"/>
        <ellipse cx="360" cy="333" rx="24" ry="14" fill="#5E7F60"/>
      </g>
    </g>
    <g transform="rotate(13 490 356)">
      <rect x="372" y="318" width="236" height="82" rx="41" fill="url(#wrap)" stroke="#D8CBB2" stroke-width="3"/>
      <g opacity=".85">
        <ellipse cx="430" cy="359" rx="26" ry="15" fill="#E9714E"/>
        <ellipse cx="490" cy="359" rx="26" ry="15" fill="#E9714E"/>
        <ellipse cx="550" cy="359" rx="24" ry="14" fill="#5E7F60"/>
      </g>
    </g>
  </g>

  <!-- dipping sauce -->
  <ellipse cx="638" cy="300" rx="72" ry="34" fill="#FFFDF8" stroke="#DCCFB8" stroke-width="3"/>
  <ellipse cx="638" cy="298" rx="56" ry="24" fill="#A8672C"/>
  <circle cx="622" cy="292" r="5" fill="#DFA13B"/><circle cx="652" cy="302" r="4" fill="#DFA13B"/>

  <!-- herbs -->
  <g fill="#5E7F60" opacity=".9">
    <ellipse cx="206" cy="424" rx="40" ry="19" transform="rotate(-14 206 424)"/>
    <ellipse cx="596" cy="428" rx="34" ry="16" transform="rotate(18 596 428)"/>
  </g>
</svg>
