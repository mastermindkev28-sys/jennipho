<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a watermelon smoothie, iced Vietnamese coffee and milk tea">
  <defs>
    <linearGradient id="p7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F2E7"/><stop offset="1" stop-color="#E6DAC3"/>
    </linearGradient>
    <linearGradient id="melon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0705E"/><stop offset="1" stop-color="#D0402F"/>
    </linearGradient>
    <linearGradient id="cof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E2C8"/><stop offset=".42" stop-color="#8A5327"/><stop offset="1" stop-color="#4A2C12"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4D9AE"/><stop offset="1" stop-color="#D89A55"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#p7)"/>
  <circle cx="140" cy="140" r="130" fill="#DFA13B" opacity=".16"/>
  <circle cx="680" cy="490" r="150" fill="#C0402A" opacity=".08"/>

  <!-- watermelon -->
  <g transform="translate(180 140)">
    <path d="M14 0h132l-16 300c-1 20-18 34-38 34H68c-20 0-37-14-38-34Z" fill="#F3EDE0" opacity=".9"/>
    <path d="M22 40h116l-14 258c-1 15-13 26-28 26H64c-15 0-27-11-28-26Z" fill="url(#melon)"/>
    <rect x="4" y="-14" width="152" height="24" rx="12" fill="#FFFDF8"/>
    <g fill="#2E2A26"><ellipse cx="60" cy="130" rx="6" ry="9"/><ellipse cx="98" cy="180" rx="6" ry="9"/><ellipse cx="66" cy="228" rx="6" ry="9"/></g>
    <rect x="112" y="-96" width="12" height="120" rx="6" fill="#5E7F60" transform="rotate(14 112 -96)"/>
  </g>

  <!-- vietnamese coffee -->
  <g transform="translate(352 176)">
    <path d="M10 0h124l-14 274c-1 19-17 32-36 32H60c-19 0-35-13-36-32Z" fill="#F3EDE0" opacity=".9"/>
    <path d="M18 34h108l-13 236c-1 14-12 24-26 24H57c-14 0-25-10-26-24Z" fill="url(#cof)"/>
    <g fill="#FFFDF8" opacity=".34">
      <rect x="34" y="96" width="34" height="34" rx="6" transform="rotate(-14 34 96)"/>
      <rect x="76" y="160" width="32" height="32" rx="6" transform="rotate(10 76 160)"/>
      <rect x="40" y="216" width="30" height="30" rx="6" transform="rotate(18 40 216)"/>
    </g>
    <rect x="0" y="-14" width="144" height="24" rx="12" fill="#FFFDF8"/>
    <rect x="98" y="-104" width="12" height="126" rx="6" fill="#7A4A22" transform="rotate(12 98 -104)"/>
  </g>

  <!-- milk tea with boba -->
  <g transform="translate(524 200)">
    <path d="M10 0h120l-14 254c-1 18-16 30-34 30H58c-18 0-33-12-34-30Z" fill="#F3EDE0" opacity=".9"/>
    <path d="M18 32h104l-13 218c-1 13-11 22-25 22H56c-14 0-24-9-25-22Z" fill="url(#tea)"/>
    <g fill="#2E2A26">
      <circle cx="46" cy="236" r="11"/><circle cx="72" cy="244" r="11"/><circle cx="98" cy="234" r="11"/>
      <circle cx="58" cy="214" r="10"/><circle cx="86" cy="214" r="10"/>
    </g>
    <rect x="0" y="-14" width="140" height="24" rx="12" fill="#FFFDF8"/>
    <rect x="94" y="-100" width="14" height="122" rx="7" fill="#C0402A" transform="rotate(10 94 -100)"/>
  </g>
</svg>
